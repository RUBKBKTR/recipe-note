<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レシピノート</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="レシピノート">
<meta name="theme-color" content="#f4f1ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500&family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec;--card:#fff;--ink:#2b2926;--sub:#8b857c;--faint:#bdb7ae;--line:#e6e1d9;
  --accent:#9c5f45;--accent-soft:#f3e7e0;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:inherit}
.grow{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(244,241,236,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);min-height:58px}
.brand{font-size:10.5px;letter-spacing:.34em;color:var(--sub)}
.tb-title{font-family:var(--serif);font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:14px;white-space:nowrap;line-height:1.3}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sub)}
.btn.danger{color:#b2463a}
.btn.small{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.4}
.icon-btn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;padding:0}
.mini{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;padding:0;color:var(--sub)}
.mini:disabled{opacity:.3}
.savest{font-size:12px;color:var(--sub);white-space:nowrap}
.note{font-size:12.5px;color:var(--sub)}
.hint{font-size:12.5px;color:var(--sub);margin:6px 0 0}

/* list */
.searchwrap{padding:12px 16px 0}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff}
.syncline{padding:8px 18px 0;font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;padding:14px 16px 120px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;padding:18px 22px 120px}}
.cardwrap{position:relative;display:flex}
.cardwrap .card{flex:1}
.card-menu{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);border:none;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.18);padding:0;font-size:18px;line-height:1;color:var(--ink)}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{text-align:left;padding:13px 16px;border-radius:14px;font-size:15.5px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);text-align:left;padding:0;display:flex;flex-direction:column}
.card .thumb{aspect-ratio:4/3;background:#ece8e1;width:100%;object-fit:cover;display:block}
.card .thumb.empty{display:grid;place-items:center;color:var(--faint);font-size:12px;letter-spacing:.2em}
.card .t{padding:10px 12px 2px;font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.4}
.card .m{font-size:11.5px;color:var(--sub);padding:0 12px 11px}
.empty-state{text-align:center;padding:80px 24px;color:var(--sub)}
.empty-state .big{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:6px}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:13px 20px;font-size:15px}

/* editor */
.editor{display:block}
.form{padding-bottom:30px}
.sec{background:#fff;border-radius:16px;padding:16px;margin:12px;border:1px solid var(--line)}
.sec h3{margin:0 0 12px;font-size:12px;letter-spacing:.24em;color:var(--sub);font-weight:500;display:flex;align-items:center;gap:8px}
.title-in{width:100%;border:none;border-bottom:1px solid var(--line);padding:6px 2px 8px;font-family:var(--serif);font-weight:600;font-size:24px;background:transparent;outline:none;border-radius:0}
.fld{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fbfaf8;width:100%;outline:none;min-width:0}
.fld:focus{border-color:#c9bfb2;background:#fff}
textarea.fld{resize:none;line-height:1.55;display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lbl{font-size:13px;color:var(--sub);white-space:nowrap}

.photo-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed #d6cfc4;border-radius:14px;padding:34px 12px;color:var(--sub);cursor:pointer;background:#fbfaf8;text-align:center}
.photo-drop b{font-weight:500;color:var(--ink)}
.photo-wrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.photo-mini{width:220px;max-width:100%;border-radius:10px;background:#eee;display:block;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.photo-mini.crop{cursor:grab;touch-action:none;outline:2px dashed rgba(156,95,69,.45);outline-offset:3px}
.photo-mini.crop:active{cursor:grabbing}
.photo-ctrl{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;background:#f1ede7;border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.slider{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px;font-size:12.5px;color:var(--sub)}
.slider input{width:100%;accent-color:var(--accent)}

.ing{display:grid;grid-template-columns:52px minmax(0,1fr) auto;grid-template-areas:"g n t" "g a t";gap:6px 8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.ing:last-child{border-bottom:none}
@media(min-width:620px){.ing{grid-template-columns:52px minmax(0,1fr) 190px auto;grid-template-areas:"g n a t"}}
.ing .g{grid-area:g;align-self:start}
.ing .n{grid-area:n}
.ing .a{grid-area:a;display:flex;gap:6px}
.ing .t{grid-area:t;display:flex;gap:4px;align-self:start}
@media(max-width:619px){.ing .t{flex-direction:column}}
.gsel{width:52px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fbfaf8;text-align:center;padding:0 4px;font-size:16px;-webkit-appearance:none;appearance:none;text-align-last:center}
.gsel.has{background:var(--accent-soft);border-color:#e4cfc3;color:var(--accent)}
.pickbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 10px;font-size:13px;color:var(--accent);white-space:nowrap}
.empty-list{color:var(--faint);font-size:13.5px;padding:8px 0}
details.grp{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.grp summary{font-size:13.5px;color:var(--sub);cursor:pointer;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::before{content:"＋ ";color:var(--faint)}
details.grp[open] summary::before{content:"－ "}
.glabels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.glabels label{display:flex;align-items:center;gap:6px;font-size:15px}

.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.snum{font-family:"Cormorant Garamond",serif;font-size:21px;color:#aaa;line-height:1.6;padding-top:2px}
.stools{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.stools .built{font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px}

.pv-pane{padding:16px}
.pv-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.paper{margin:0 auto}
.paper canvas{width:100%;height:auto;display:block;background:#fff;box-shadow:0 2px 16px rgba(60,40,20,.10);border-radius:2px}
.bottombar{position:sticky;bottom:0;z-index:20;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(244,241,236,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bottombar .btn{flex:1;padding:11px}
@media(min-width:900px){
  .editor{display:grid;grid-template-columns:minmax(400px,1fr) minmax(0,1.2fr);align-items:start}
  .pv-pane{position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;border-left:1px solid var(--line)}
  .mobile-only{display:none!important}
}
@media(max-width:899px){.pv-pane{display:none}.wide-only{display:none!important}}

/* view */
.view-body{padding:16px 16px 60px;max-width:1100px;margin:0 auto}
.view-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
.readable{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.readable h4{margin:0 0 8px;font-size:12px;letter-spacing:.24em;color:var(--sub);font-weight:500}
.readable .il{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eee}
.readable .sl{display:grid;grid-template-columns:30px 1fr;gap:6px;padding:7px 0}
.readable .sl span:first-child{font-family:"Cormorant Garamond",serif;color:#aaa;font-size:18px}
.readable .blk+.blk{margin-top:18px}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(35,28,22,.38);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .24s ease;overflow:hidden}
@media(min-width:760px){.backdrop{align-items:center;padding:20px}.sheet{border-radius:20px;max-height:88vh}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--line);background:#fff}
.sheet-head .st{flex:1;font-weight:500;font-size:15.5px}
.sheet-body{overflow:auto;padding:14px 16px 18px;-webkit-overflow-scrolling:touch;flex:1}
.sheet-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#fff;align-items:center}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.35;position:relative}
.chip.sm{padding:4px 10px;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.added{border-color:#d9c3b6;background:var(--accent-soft)}
.chip .ord{display:inline-block;min-width:16px;height:16px;border-radius:8px;background:#fff;color:var(--ink);font-size:10.5px;line-height:16px;text-align:center;margin-right:5px}
.chip.ghost{border-style:dashed;color:var(--sub)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:#ebe6df;border-radius:999px;padding:6px 13px;font-size:13.5px;white-space:nowrap;color:var(--sub)}
.tab.on{background:var(--accent);color:#fff}
.bl{font-size:12.5px;color:var(--sub);margin:12px 0 6px;letter-spacing:.05em}
.bprev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;min-height:52px;line-height:1.6}
.bprev .ph{color:var(--faint)}
.bclauses{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cl{display:flex;align-items:center;gap:8px;background:#efe9e2;border-radius:10px;padding:6px 6px 6px 12px;font-size:14px}
.cl span{flex:1}
.inrow{display:flex;gap:6px}
.sug{margin-top:6px}
.divider{height:1px;background:var(--line);margin:16px 0 4px}
.amtprev{font-size:22px;font-family:var(--serif);font-weight:600;text-align:center;padding:10px;background:#fff;border-radius:12px;border:1px solid var(--line);min-height:56px}
.ex-sticky{padding:0 0 10px}
.sizegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.sizebtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 6px;text-align:center}
.sizebtn small{display:block;color:var(--sub);font-size:11px}
.sizebtn.on{border-color:var(--ink);background:var(--ink);color:#fff}
.sizebtn.on small{color:#ddd}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(40,36,32,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:90;pointer-events:none;animation:fade .2s;max-width:88vw;text-align:center}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.imgout{width:100%;display:block;border:1px solid var(--line);background:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
</style>
</head>

    for(let i=0;i<10;i++){
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));

function ingBlock(ctx,x,y,w,U,f,r,draw){
  const hs=3.7*U*f;ctx.font=FONT.sans(hs);
  if(draw){ctx.fillStyle='#4a4a4a';const hw=drawSp(ctx,'材料',x,y+hs,0.5*U*f);
    if((r.servings||'').trim()){ctx.font=FONT.sans(hs*0.8);ctx.fillStyle='#9a9a9a';drawSp(ctx,'（'+r.servings.trim()+'）',x+hw+1.2*U*f,y+hs,0.15*U*f)}}
  let end=y+hs; y=y+hs+2.6*U*f;
  const fs=3.4*U*f,rowH=9.6*U*f,lh=4.9*U*f,sp=0.22*U*f,m=marksOf(r);
  for(const ing of r.ingredients){

const imgCache=new Map();
function loadImg(url){
  if(!url) return Promise.reject(new Error('no url'));
  if(imgCache.has(url)) return imgCache.get(url);
  const p=new Promise((res,rej)=>{const i=new Image();i.decoding='async';i.onload=()=>res(i);i.onerror=()=>{imgCache.delete(url);rej(new Error('img'))};i.src=url});
  imgCache.set(url,p);return p;
}
const loadedFontText=new Set();
async function ensureFonts(r,header){
  if(!document.fonts||!document.fonts.load) return;
  const txt=[r.title,header,r.servings,r.memo,'材料作り方メモ（）無題のレシピ0123456789',...r.ingredients.map(i=>(i.name||'')+(i.amount||'')),...r.steps.map(s=>s.text||''),...r.groupLabels,...marksOf(r)].join('');
  const chars=[...new Set([...txt])].filter(c=>!loadedFontText.has(c)).join('');
  if(!chars) return;
  try{
    await timeout(Promise.all([
      document.fonts.load('400 20px "Zen Kaku Gothic New"',chars),
      document.fonts.load('600 20px "Shippori Mincho"',chars),
      document.fonts.load('400 20px "Cormorant Garamond"','0123456789'),
    ]),3000);
    for(const c of chars)loadedFontText.add(c);
  }catch(e){}
}
async function drawInto(canvas,r){
  if(!canvas||!canvas.isConnected||!r) return;
  const seq=(canvas._seq||0)+1;canvas._seq=seq;
  const pg=pageDims(S.settings.lastSize,S.settings.lastOrient);
  const box=canvas.parentElement;
  const cssW=Math.max(200,box.clientWidth||600);
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  const W=Math.min(Math.round(cssW*dpr),2400),H=Math.round(W*pg.h/pg.w);
  let img=null;if(r.photo){try{img=await loadImg(photoURL(r.photo))}catch(e){}}
  await ensureFonts(r,S.settings.header);
  if(canvas._seq!==seq||!canvas.isConnected) return;
  const off=document.createElement('canvas');off.width=W;off.height=H;
  renderPage(off.getContext('2d'),W,H,pg,r,{img,header:S.settings.header});
  if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H}
  canvas.getContext('2d').drawImage(off,0,0);
}
function fitPaper(el){
  const pg=pageDims(S.settings.lastSize,S.settings.lastOrient);
  el.style.maxWidth=`calc((100vh - 170px) * ${(pg.w/pg.h).toFixed(4)})`;
}

/* ================= PDF ================= */
function pdfStr(s){let h='FEFF';for(const c of s){const cp=c.codePointAt(0);if(cp>0xffff){const v=cp-0x10000;h+=(0xD800+(v>>10)).toString(16).padStart(4,'0')+(0xDC00+(v&0x3ff)).toString(16).padStart(4,'0')}else h+=cp.toString(16).padStart(4,'0')}return'<'+h.toUpperCase()+'>'}
function buildPdf(jpeg,pxW,pxH,ptW,ptH,title){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
  const obj=(n,fn)=>{offs[n]=len;push(n+' 0 obj\n');fn();push('\nendobj\n')};
  const fx=n=>n.toFixed(2);
  push('%PDF-1.4\n');push(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${fx(ptW)} ${fx(ptH)}] /Resources << /XObject << /Im0 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>`));
  obj(4,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${pxW} /Height ${pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);push(jpeg);push('\nendstream')});
  const content=`q\n${fx(ptW)} 0 0 ${fx(ptH)} 0 0 cm\n/Im0 Do\nQ\n`;
  obj(5,()=>push(`<< /Length ${enc.encode(content).length} >>\nstream\n${content}endstream`));
  obj(6,()=>push(`<< /Title ${pdfStr(title)} /Producer (Recipe Note) >>`));
  const xref=len;let x='xref\n0 7\n0000000000 65535 f \n';
  for(let i=1;i<=6;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x);push(`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}
async function renderHiRes(r){
  const pg=pageDims(S.settings.lastSize,S.settings.lastOrient);
  const inW=pg.w/25.4,inH=pg.h/25.4;
  const dpi=Math.min(300,Math.sqrt(10e6/(inW*inH)));
  const W=Math.round(inW*dpi),H=Math.round(inH*dpi);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  let img=null;if(r.photo){try{img=await loadImg(photoURL(r.photo))}catch(e){}}
  await ensureFonts(r,S.settings.header);
  renderPage(c.getContext('2d'),W,H,pg,r,{img,header:S.settings.header});
  return{c,W,H,pg};
}
async function makePdf(r){
  const{c,W,H,pg}=await renderHiRes(r);
  const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.93));
  const buf=new Uint8Array(await blob.arrayBuffer());
  c.width=c.height=1;
  return buildPdf(buf,W,H,pg.w/25.4*72,pg.h/25.4*72,(r.title||'').trim()||'レシピ');
}
function pdfName(r){
  const s=SIZES.find(x=>x.k===S.settings.lastSize)||SIZES[0];
  const t=((r.title||'').trim()||'レシピ').replace(/[\\/:*?"<>|\n\r]/g,'').slice(0,60);
  return `${t}_${s.l}${S.settings.lastOrient==='portrait'?'縦':'横'}.pdf`;
}

function resolveRefs(refs,r){
  const m=marksOf(r);
  const names=(refs||[]).map(ref=>{
    const i=ref.indexOf(':'),k=ref.slice(0,i),v=ref.slice(i+1);
    if(k==='i'){const ing=r.ingredients.find(x=>x.id===v);return ing?stripName(ing.name):null}
    if(k==='g')return m[(+v)-1]||null;
    if(k==='t')return v;
    return null;
  }).filter(Boolean);
  if(!names.length)return'';
  if(names.length===1)return names[0];
  if(names.length===2)return names[0]+'と'+names[1];
  return names.join('、');
}
function clauseParts(c,r){
  const t=TPL[c.tpl];if(!t)return{b:'',v:null};
  const p=Object.assign({},c.p);
  p.X=resolveRefs(c.p.X,r);p.W=resolveRefs(c.p.W,r);
  p.time=(p.time||'').trim();p.temp=String(p.temp||'').replace(/[℃度\s]/g,'');
  const res=t.b(p);
  return typeof res==='string'?{b:res,v:t.v}:res;
}
function composeSentence(clauses,r,withPeriod){
  let out='';
  clauses.forEach((c,i)=>{
    const{b,v}=clauseParts(c,r);const last=i===clauses.length-1;
    if(!v){out+=b+(last?'':(c.conn==='stop'?'。':'、'));return}
    const f=V[v];
    if(last)out+=b+f[0];
    else if(c.conn==='tara')out+=b+f[2]+'、';
    else if(c.conn==='stop')out+=b+f[0]+'。';
    else out+=b+f[1]+'、';
  });

function bindPhotoMini(){
  const c=$('#pmini');if(!c||c._bound)return;c._bound=true;
  const pts=new Map();let st=null;
  const syncSliders=()=>{const r=S.cur;[['panX',r.panX],['panY',r.panY],['zoom',r.zoom]].forEach(([k,v])=>{const i=$(`#sec-photo input[data-f="${k}"]`);if(i)i.value=Math.round(v*100)})};
  const begin=async()=>{
    const r=S.cur;let img;try{img=await loadImg(photoURL(r.photo))}catch(e){return}
    const p=[...pts.values()];
    st={iw:img.naturalWidth,ih:img.naturalHeight,panX:r.panX??.5,panY:r.panY??.5,zoom:r.zoom||1,p0:p.map(q=>({...q})),
        d0:p.length>1?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0,cx0:p.reduce((a,q)=>a+q.x,0)/p.length,cy0:p.reduce((a,q)=>a+q.y,0)/p.length,zFix:null};
  };
  c.addEventListener('click',()=>{if(S.cur&&S.cur.photoMode!=='crop')$('#filein').click()});
  c.addEventListener('pointerdown',e=>{
    if(!S.cur||S.cur.photoMode!=='crop')return;
    e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});begin();
  });
  c.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)||!st)return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=S.cur,p=[...pts.values()],rect=c.getBoundingClientRect();
    let zoom=st.zoom;
    if(p.length>1&&st.d0>0){zoom=Math.min(3,Math.max(1,st.zoom*Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)/st.d0))}
    const cx=p.reduce((a,q)=>a+q.x,0)/p.length,cy=p.reduce((a,q)=>a+q.y,0)/p.length;
    const s=Math.max(c.width/st.iw,c.height/st.ih)*zoom,sw=c.width/s,sh=c.height/s;
    const s0=Math.max(c.width/st.iw,c.height/st.ih)*st.zoom,sw0=c.width/s0,sh0=c.height/s0;
    // 拡大の中心を保ったまま移動
    const cssToImg=sw/rect.width;
    const centerX0=(st.iw-sw0)*st.panX+sw0/2,centerY0=(st.ih-sh0)*st.panY+sh0/2;
    const nx=centerX0-(cx-st.cx0)*cssToImg-sw/2,ny=centerY0-(cy-st.cy0)*(sh/rect.height)-sh/2;
    r.zoom=zoom;
    r.panX=st.iw-sw>0.5?Math.min(1,Math.max(0,nx/(st.iw-sw))):.5;
    r.panY=st.ih-sh>0.5?Math.min(1,Math.max(0,ny/(st.ih-sh))):.5;
    drawPhotoMini();syncSliders();
  });
  const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(pts.size){begin()}else{st=null;changed()}};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
function isSidePlace(r){const L=S.settings.lastOrient!=='portrait';const p=photoPlaceOf(r,L);return p==='left'||p==='right'}
async function drawPhotoMini(){
  const c=$('#pmini'),r=S.cur;if(!c||!r||!r.photo)return;
  let img;try{img=await loadImg(photoURL(r.photo))}catch(e){return}
  if(!c.isConnected)return;
  const Wc=440;let ratio;
  if(r.photoMode==='crop'){ratio=RATIOS[r.cropRatio]||(4/3)}else ratio=img.naturalWidth/img.naturalHeight;
  const Hc=Math.round(Wc/ratio);c.width=Wc;c.height=Math.min(Hc,700);
  const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
  drawPhoto(ctx,img,r,{x:0,y:0,w:c.width,h:c.height},0);
}
async function handleFile(file){
  if(!file||!S.cur)return;
  uploading=true;renderPhotoSec();
  const target=S.cur;
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode'));i.src=url});
    let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,2400/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    const photo=await Store.uploadPhoto(c,w,h);
    if(S.cur!==target){uploading=false;return}
    const old=S.cur.photo;
    S.cur.photo=photo;S.cur.panX=.5;S.cur.panY=.5;S.cur.zoom=1;
    uploading=false;renderPhotoSec();changed();
    if(old)setTimeout(()=>Store.deletePhotoIfUnused(old,S.cur&&S.cur.id),2500);
  }catch(e){
    uploading=false;renderPhotoSec();
    toast(e&&e.code==='quota_or_state'?'保存容量がいっぱいで写真を追加できません':'写真を読み込めませんでした');
  }
}

function bSentence(){return composeSentence([...B.clauses,B.cur],S.cur,S.settings.period)}
function builderBody(){

}
function refOptions(){
  const r=S.cur,m=marksOf(r);const opts=[];
  const groups=[...new Set(r.ingredients.filter(i=>i.group>0).map(i=>i.group))].sort();
  groups.forEach(g=>opts.push({ref:'g:'+g,label:m[g-1]+(r.groupLabels[g-1]?' '+r.groupLabels[g-1]:'')+'（グループ）'}));
  const seen=new Set();
  r.ingredients.forEach(i=>{const n=(i.name||'').trim();if(!n)return;const key=stripName(n);if(seen.has(key))return;seen.add(key);opts.push({ref:'i:'+i.id,label:(i.group>0?m[i.group-1]+' ':'')+n})});
  return opts;
}
function refField(fk,label){
  const sel=B.cur.p[fk]||[];const opts=refOptions();
  const texts=sel.filter(s=>s.startsWith('t:'));
  return`<div class="bl">${esc(label)}</div><div class="chips">
  ${opts.map(o=>{const idx=sel.indexOf(o.ref);return`<button class="chip ${idx>=0?'on':''}" data-act="b-ref" data-k="${fk}" data-v="${esc(o.ref)}">${idx>=0&&sel.length>1?`<span class="ord">${idx+1}</span>`:''}${esc(o.label)}</button>`}).join('')}
  ${texts.map(s=>`<button class="chip on" data-act="b-ref" data-k="${fk}" data-v="${esc(s)}">${esc(s.slice(2))} ×</button>`).join('')}
  </div>${opts.length?'':'<p class="hint">材料欄に入れた材料がここに並びます</p>'}
  <div class="inrow" style="margin-top:6px"><input class="fld" data-bt="${fk}" placeholder="その他（例: 衣、鍋の中身）" enterkeyhint="done"><button class="btn small" data-act="b-ref-add" data-k="${fk}">追加</button></div>`;
}
function bFields(t){
  const p=B.cur.p;let h='';
  if(!t.f.length)return'<p class="note">設定する項目はありません</p>';
  for(const fk of t.f){
    if(fk==='X'){h+=refField('X',t.xl||'対象の材料');continue}
    if(fk==='W'){h+=refField('W',t.wl||'加えるもの');continue}
    const d=FIELDS[fk];if(d.show&&!d.show(p))continue;
    if(d.type==='chips'){const opts=fk==='until'?(t.until||[]):d.opts;
      h+=`<div class="bl">${d.label}</div><div class="chips">${opts.map(o=>`<button class="chip sm ${p[fk]===o?'on':''}" data-act="b-opt" data-k="${fk}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}
    else if(d.type==='text'){
      h+=`<div class="bl">${d.label}</div><input class="fld" data-bf="${fk}" value="${esc(p[fk]||'')}" placeholder="${esc(d.ph||'')}" ${d.im?`inputmode="${d.im}"`:''} style="max-width:260px"><div class="chips sug">${(d.sug||[]).map(s=>`<button class="chip sm" data-act="b-sug" data-k="${fk}" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}
    else if(d.type==='area'){h+=`<div class="bl">${d.label}</div><textarea class="fld" data-bf="${fk}" rows="3" placeholder="${esc(d.ph)}">${esc(p[fk]||'')}</textarea>`}
  }
  return h;
}

/* ---- backup / files ---- */
function dataURLtoBlob(u){const[h,b]=u.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.slice(5).split(';')[0]})}
function offerFile(name,blob){
  const f=new File([blob],name,{type:blob.type||'application/octet-stream'});
  let canShare=false;try{canShare=!!(navigator.canShare&&navigator.canShare({files:[f]}))}catch(e){}
  const bd=openSheet('file','ファイルの準備ができました',`<p style="margin:0 0 6px;word-break:break-all">${esc(name)}</p><p class="hint">${canShare?'「保存・共有」から「ファイルに保存」、プリント、AirDropなどを選べます。':'ボタンを押すとダウンロードされます。'}</p>`,
    `${canShare?'<button class="btn" data-x="dl">ダウンロード</button>':''}<button class="btn accent" data-x="${canShare?'share':'dl'}">${canShare?'保存・共有':'ダウンロード'}</button>`);
  bd.addEventListener('click',async e=>{
    const b=e.target.closest('[data-x]');if(!b)return;
    if(b.dataset.x==='share'){try{await navigator.share({files:[f],title:name});closeSheet('file')}catch(err){if(!err||err.name!=='AbortError')toast('共有できませんでした。「ダウンロード」を試してください')}}
    else{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);closeSheet('file')}
  });
}
async function saveFile(name,data){
  if(!S.dl){const blob=data instanceof Blob?data:new Blob([data],{type:name.endsWith('.json')?'application/json':'application/octet-stream'});offerFile(name,blob);return true}
  try{await S.dl.save({filename:name,data});toast('保存しました');return true}
  catch(e){if(!(e&&e.code==='declined'))toast('保存できませんでした'+(e&&e.code?`（${e.code}）`:''));return false}
}
function blobToDataURL(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)})}
async function doBackup(){
  toast('バックアップを作成中…');
  const list=[];
  for(const r0 of S.recipes){
    const r=clone(r0);
    if(r.photo&&r.photo.id&&!r.photo.data){try{const b=await (await fetch(photoURL(r.photo))).blob();r.photo={data:await blobToDataURL(b),w:r.photo.w,h:r.photo.h}}catch(e){}}
    list.push(r);
  }
  const d=new Date();const ds=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  await saveFile(`レシピノート_バックアップ_${ds}.json`,JSON.stringify({app:'recipe-note',version:1,recipes:list,customIngs:S.settings.customIngs||[]}));
}
async function doRestore(file){
  try{
    const j=JSON.parse(await file.text());
    if(!j||j.app!=='recipe-note'||!Array.isArray(j.recipes))throw new Error('format');
    if(!(await confirmBox(`${j.recipes.length}件のレシピを読み込みます。同じレシピがある場合は上書きされます。`,'読み込む')))return;
    let n=0,fail=0;
    for(const r0 of j.recipes){
      const r=normalize(r0);
      if(r.photo&&r.photo.data&&Store.mode==='cloud'){
        try{const img=await loadImg(r.photo.data);const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);r.photo=await Store.uploadPhoto(c,c.width,c.height)}catch(e){}
      }
      const i=S.recipes.findIndex(x=>x.id===r.id);if(i>=0)S.recipes[i]=r;else S.recipes.push(r);
      try{await Store.put(r);n++}catch(e){fail++}
    }
    const ci=new Set([...(S.settings.customIngs||[]),...(j.customIngs||[])]);S.settings.customIngs=[...ci].slice(0,120);saveSettingsSoon();
    closeSheet('settings');renderList();toast(`${n}件を読み込みました`+(fail?`（${fail}件失敗）`:''));
  }catch(e){toast('バックアップファイルを読み込めませんでした')}
}
$('#restorein').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)doRestore(f)});

/* ---- settings ---- */
function settingsBody(){
  const c=S.settings.customIngs||[];
  return`<div class="bl" style="margin-top:0">印刷物の上部に入る文字（空欄で非表示）</div>
  <input class="fld" data-sf="header" value="${esc(S.settings.header)}" placeholder="RECIPE NOTE">
  <label class="switch"><span>組み立てた手順の文末に「。」をつける</span><input type="checkbox" data-sf="period" ${S.settings.period?'checked':''}></label>
  <div class="bl">マイ材料（手入力で追加した材料）</div>
  <div class="chips">${c.length?c.map(n=>`<button class="chip sm" data-act="ci-del" data-v="${esc(n)}">${esc(n)} ×</button>`).join(''):'<span class="note">まだありません</span>'}</div>
  <div class="bl">保存先</div><div class="note">${modeNote().replace(/<[^>]+>/g,'')}</div>
  ${Store.mode!=='cloud'?'<p class="hint">端末保存はブラウザのデータ削除などで消えることがあります。ときどきバックアップを保存しておくと安心です。</p>':''}
  <div class="bl">バックアップ</div>
  <div class="row"><button class="btn small" data-act="backup">バックアップを保存</button><label class="btn small" for="restorein">バックアップから復元</label></div>
  <div class="bl">ホーム画面に追加</div>
  <div class="row" style="align-items:center;flex-wrap:nowrap"><img src="${ICON_PNG}" alt="" style="width:52px;height:52px;border-radius:12px;border:1px solid var(--line);flex:none"><p class="hint" style="margin:0">iPhone/iPadはSafariの共有ボタン →「ホーム画面に追加」。Androidは Chrome のメニュー →「ホーム画面に追加」。アプリとして全画面で開き、オフラインでも使えます。</p></div>`;
}

/* ================= events ================= */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,v=el.dataset.v;
  const row=el.closest('[data-id].ing,[data-id].step');
  const rid=row&&row.dataset.id;
  if(el.closest('[data-sheet="cmenu"]')&&act!=='sheet-close')closeSheet('cmenu');
  switch(act){
    case'sheet-close':closeSheet(el.dataset.id);break;
    case'card-menu':{const r=S.recipes.find(x=>x.id===el.dataset.id);if(!r)break;const id=esc(r.id);
      openSheet('cmenu',r.title||'無題のレシピ',`<div class="menu-list"><button class="btn" data-act="open" data-id="${id}">開く</button><button class="btn" data-act="edit" data-id="${id}">編集する</button><button class="btn" data-act="export" data-id="${id}">PDFで保存</button><button class="btn" data-act="dup" data-id="${id}">複製する</button><button class="btn danger" data-act="del" data-id="${id}">削除する</button></div>`,'');break}
    case'del-cur':{const r=S.cur;if(!r)break;if(!(await confirmBox(`「${r.title||'無題のレシピ'}」を削除します。元に戻せません。`,'削除する',true)))break;
      saveSoon.cancel();const id=r.id,photo=r.photo,saved=r._saved;S.cur=null;
      S.recipes=S.recipes.filter(x=>x.id!==id);if(saved){try{await Store.del(id)}catch(err){toast('削除できませんでした')}}
      Store.deletePhotoIfUnused(photo,id);renderList();toast('削除しました');break}
    case'new':startEdit(null);break;
    case'open':renderView(el.dataset.id);break;
    case'home':renderList();break;
    case'edit':startEdit(el.dataset.id);break;
    case'leave':leaveEditor('view');break;
    case'settings':openSheet('settings','設定',settingsBody(),`<button class="btn primary" data-act="sheet-close" data-id="settings">閉じる</button>`);break;
    case'ci-del':S.settings.customIngs=(S.settings.customIngs||[]).filter(x=>x!==v);saveSettingsSoon();updateSheet('settings',settingsBody());break;
    case'dup':{const r=S.recipes.find(x=>x.id===el.dataset.id);if(!r)break;const c=normalize(clone(r));c.id='r'+uid();c.title=(r.title||'無題のレシピ')+'（コピー）';c.createdAt=c.updatedAt=Date.now();S.recipes.push(c);try{await Store.put(c);toast('複製しました')}catch(err){toast('複製できませんでした')}renderView(c.id);break}
    case'del':{const r=S.recipes.find(x=>x.id===el.dataset.id);if(!r)break;if(!(await confirmBox(`「${r.title||'無題のレシピ'}」を削除します。元に戻せません。`,'削除する',true)))break;
      S.recipes=S.recipes.filter(x=>x.id!==r.id);try{await Store.del(r.id)}catch(err){toast('削除できませんでした')}
      Store.deletePhotoIfUnused(r.photo,r.id);renderList();toast('削除しました');break}
    case'export':{const r=S.view==='edit'&&!el.dataset.id?S.cur:S.recipes.find(x=>x.id===(el.dataset.id||S.viewId));if(!r)break;if(S.view==='edit')saveNow();closeSheet('mpv');openExport(r,false);break}
    case'paper':{const r=S.view==='edit'?S.cur:S.recipes.find(x=>x.id===(el.dataset.id||S.viewId));if(!r)break;closeSheet('mpv');openExport(r,true);break}
    case'size':S.settings.lastSize=v;saveSettingsSoon();refreshExport();break;
    case'orient':S.settings.lastOrient=v;saveSettingsSoon();refreshExport();break;
    case'ex-pdf':doExportPdf();break;
    case'ex-place':{const r=exportTarget;if(!r)break;const was=isSidePlace(r);r.photoPlace=v;if(isSidePlace(r)!==was)r.photoSize=null;exChanged();refreshExport();break}
    case'ex-preset':{const r=exportTarget;if(!r)break;r.photoPlace='auto';r.photoSize=null;exChanged();refreshExport();break}
    case'backup':doBackup();break;
    case'icon-dl':saveFile('recipe-note-icon.png',dataURLtoBlob(ICON_PNG));break;
    case'ex-img':doExportImg();break;
    case'preview':openMobilePreview();break;
    /* photo */
    case'pmode':S.cur.photoMode=v;renderPhotoSec();changed();break;
    case'pratio':S.cur.cropRatio=v;renderPhotoSec();changed();break;
    case'pplace':{const wasSide=isSidePlace(S.cur);S.cur.photoPlace=v;if(isSidePlace(S.cur)!==wasSide)S.cur.photoSize=null;renderPhotoSec();changed();break}
    case'preset':S.cur.photoPlace='auto';S.cur.photoSize=null;renderPhotoSec();changed();break;
    case'pdel':{const old=S.cur.photo;S.cur.photo=null;renderPhotoSec();changed();setTimeout(()=>Store.deletePhotoIfUnused(old,S.cur&&S.cur.id),3000);break}
    /* ingredients */
    case'pick':openPicker();break;
    case'ing-blank':addIngredient('',0);setTimeout(()=>{const ins=$$('#ing-list .ing input[data-f="name"]');ins.length&&ins[ins.length-1].focus()},30);break;
    case'ing-up':case'ing-down':{const a=S.cur.ingredients,i=a.findIndex(x=>x.id===rid),j=act==='ing-up'?i-1:i+1;if(i<0||j<0||j>=a.length)break;[a[i],a[j]]=[a[j],a[i]];renderIngList();changed();break}
    case'ing-del':S.cur.ingredients=S.cur.ingredients.filter(x=>x.id!==rid);renderIngList();changed({regen:true});break;
    case'gstyle':S.cur.groupStyle=v;renderIngSec();changed({regen:true});break;
    case'amt':openAmount(rid);break;
    case'pk-group':PK.group=+v;refreshPicker();break;
    case'pk-cat':PK.cat=v;PK.q='';refreshPicker();break;
    case'pk-add':addIngredient(v,PK.group);toast(`「${v}」を追加`);refreshPicker();break;
    case'pk-custom':addCustom();break;
    case'am':{AM[el.dataset.k]=AM[el.dataset.k]===v?'':v;if(el.dataset.k!=='word')AM.word='';else{AM.num='';AM.unit=''}updateSheet('amount',amountBody());break}
    case'am-clear':AM={...AM,num:'',unit:'',word:'',raw:''};updateSheet('amount',amountBody());break;
    case'am-ok':{const raw=$('#am-raw');const val=(raw?raw.value:amCompose()).trim();const ing=S.cur.ingredients.find(i=>i.id===AM.id);if(ing){ing.amount=val}closeSheet('amount');renderIngList();changed();break}
    /* steps */
    case'step-blank':S.cur.steps.push({id:'s'+uid(),text:''});renderStepList();changed();setTimeout(()=>{const t=$$('#step-list textarea');t.length&&t[t.length-1].focus()},30);break;
    case'step-up':case'step-down':{const a=S.cur.steps,i=a.findIndex(x=>x.id===rid),j=act==='step-up'?i-1:i+1;if(i<0||j<0||j>=a.length)break;[a[i],a[j]]=[a[j],a[i]];renderStepList();changed();break}
    case'step-del':S.cur.steps=S.cur.steps.filter(x=>x.id!==rid);renderStepList();changed();break;
    case'build-new':openBuilder(null);break;
    case'build-edit':openBuilder(rid);break;
    case'b-cat':B.cat=v;{const first=Object.values(TPL).find(x=>x.c===v);if(first&&TPL[B.cur.tpl].c!==v)selectTpl(first.k)}refreshBuilder();break;
    case'b-tpl':selectTpl(v);refreshBuilder();break;
    case'b-opt':{const k=el.dataset.k;B.cur.p[k]=B.cur.p[k]===v?'':v;refreshBuilder();break}
    case'b-sug':{const k=el.dataset.k;B.cur.p[k]=v;refreshBuilder();break}
    case'b-ref':{const k=el.dataset.k,a=B.cur.p[k]||(B.cur.p[k]=[]);const i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);refreshBuilder();break}
    case'b-ref-add':{const k=el.dataset.k,inp=$(`[data-bt="${k}"]`);const val=(inp&&inp.value||'').trim();if(!val)break;(B.cur.p[k]||(B.cur.p[k]=[])).push('t:'+val);refreshBuilder();break}
    case'b-conn':B.conn=v;refreshBuilder();break;
    case'b-chain':{B.cur.conn=B.conn;B.clauses.push(B.cur);B.cur={tpl:B.cur.tpl,p:{X:[],W:[],cut:B.cur.p.cut}};refreshBuilder();break}
    case'b-cl-del':B.clauses.splice(+el.dataset.i,1);refreshBuilder();break;
    case'b-commit':{
      const build=[...B.clauses,B.cur];const text=composeSentence(build,S.cur,S.settings.period);
      if(!text.trim()){toast('動作を選んでください');break}
      if(B.stepId){const st=S.cur.steps.find(s=>s.id===B.stepId);if(st){st.text=text;st.build=clone(build)}}
      else S.cur.steps.push({id:'s'+uid(),text,build:clone(build)});
      closeSheet('builder');renderStepList();changed();break}
  }
});
function selectTpl(k){const t=TPL[k];B.cur.tpl=k;B.cat=t.c;const p=B.cur.p;if(p.until&&!(t.until||[]).includes(p.until))p.until='';if(k==='cut'&&!p.cut)p.cut='一口大'}

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='search'){S.q=el.value;const pos=el.selectionStart;renderList();const s=$('#search');s.focus();try{s.setSelectionRange(pos,pos)}catch(_){}return}
  if(el.id==='pk-q'){PK.q=el.value;const pos=el.selectionStart;refreshPicker();const i=$('#pk-q');i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}return}
  if(el.id==='am-raw'){AM.raw=el.value;AM.num='';AM.unit='';AM.word='';const p=$('#am-prev');if(p)p.textContent=el.value;return}
  if(el.dataset.exf&&exportTarget){
    const k=el.dataset.exf,v=+el.value;const r=exportTarget;
    if(k==='photoSize'){r.photoSize=v/100;const l=$('#ex-psize');if(l)l.textContent=v+'%'}
    else if(k==='zoom')r.zoom=v/100;else r[k]=v/100;
    exChanged();exRedraw();return;
  }
  if(el.dataset.bf&&B){B.cur.p[el.dataset.bf]=el.value;updateBPrev();return}
  if(el.dataset.sf){const k=el.dataset.sf;S.settings[k]=el.type==='checkbox'?el.checked:el.value;saveSettingsSoon();if(S.cur){if(k==='period')regenSteps();previewSoon()}return}
  if(el.dataset.gl!==undefined&&S.cur){S.cur.groupLabels[+el.dataset.gl]=el.value;changed();return}
  const f=el.dataset.f;if(!f||!S.cur)return;
  const r=S.cur;
  const row=el.closest('.ing,.step');
  if(row&&row.classList.contains('ing')){
    const ing=r.ingredients.find(i=>i.id===row.dataset.id);if(!ing)return;
    if(f==='group'){ing.group=+el.value;el.classList.toggle('has',ing.group>0);if(ing.group>0)openGrp();changed({regen:true});return}
    ing[f]=el.value;changed({regen:f==='name'});return;
  }
  if(row&&row.classList.contains('step')){
    const st=r.steps.find(s=>s.id===row.dataset.id);if(!st)return;
    st.text=el.value;if(st.build){delete st.build;const b=$('.built',row);b&&b.remove()}
    autoGrow(el);changed();return;
  }
  if(f==='panX'||f==='panY'){r[f]=(+el.value)/100;drawPhotoMini();changed();return}
  if(f==='zoom'){r.zoom=(+el.value)/100;drawPhotoMini();changed();return}
  if(f==='photoSize'){r.photoSize=(+el.value)/100;const v=$('#psize-v');if(v)v.textContent=el.value+'%';changed();return}
  if(f==='title'||f==='servings'||f==='memo'){r[f]=el.value;if(el.tagName==='TEXTAREA')autoGrow(el);changed();return}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.f==='group'){el.dispatchEvent(new Event('input',{bubbles:true}))}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  const el=e.target;
  if(el.id==='pk-q'){e.preventDefault();addCustom()}
  else if(el.dataset&&el.dataset.bt){e.preventDefault();const b=el.parentElement.querySelector('[data-act="b-ref-add"]');b&&b.click()}
  else if(el.classList&&el.classList.contains('title-in')){e.preventDefault();el.blur()}
});
window.addEventListener('resize',debounce(()=>{
  if(S.view==='edit'){drawInto($('#pv'),S.cur);drawInto($('#pv-m'),S.cur)}
  if(S.view==='view'){const r=S.recipes.find(x=>x.id===S.viewId);r&&drawInto($('#vcanvas'),r)}
},250));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow()});
window.addEventListener('pagehide',()=>saveNow());

/* ================= boot ================= */
renderList();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
(async()=>{
  const c=window.claude;
  if(c&&typeof c.use==='function'){timeout(c.use('downloads'),12000).then(d=>{S.dl=d||null}).catch(()=>{})}
  await Store.init();
  if(S.view==='list')renderList();
})();
</script>
